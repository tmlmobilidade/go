name: 'Build Binary GTFS Validator'

on:
  workflow_dispatch:
  push:
    branches:
      - go-695-passar-o-validador-para-o-go
      # - prd
    paths:
      - '.github/workflows/build-binary.yml'
      - 'modules/operation/apps/validator/validator/compile.sh'
      - 'modules/operation/apps/validator/validator/src/**'
      - 'packages-new/interfaces/validator-db/src/**'
      - 'packages-new/types/gtfs-validator/src/validation/**'
      - '!modules/operation/apps/validator/ts-wrapper/bin/**'

permissions:
  contents: write

jobs:
  release-validator:
    name: Release Validator Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: modules/operation/apps/validator/validator/src/go.mod
          cache-dependency-path: modules/operation/apps/validator/validator/src/go.sum

      - name: Build binaries
        shell: bash
        run: bash modules/operation/apps/validator/validator/compile.sh

      - name: Create GitHub release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="validator-build-${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Validator build ${GITHUB_RUN_NUMBER}" \
            --notes "Validator binaries built from commit ${GITHUB_SHA}." \
            modules/operation/apps/validator/ts-wrapper/bin/validator-linux-amd64 \
            modules/operation/apps/validator/ts-wrapper/bin/validator-linux-arm64 \
            modules/operation/apps/validator/ts-wrapper/bin/validator-darwin-amd64 \
            modules/operation/apps/validator/ts-wrapper/bin/validator-darwin-arm64
